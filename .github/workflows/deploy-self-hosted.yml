name: Deploy to Fedora Server

on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Pull latest image
        run: |
          docker pull ghcr.io/aryankinha2024/api-server:latest

      - name: Stop old container
        run: |
          docker rm -f api-server || true

      - name: Run new container
        run: |
          docker run -d \
            --name api-server \
            --restart unless-stopped \
            -p 5000:5000 \
            -e FRONTEND_URL=http://localhost:5000 \
            ghcr.io/aryankinha2024/api-server:latest
