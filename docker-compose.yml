version: '3.8'

services:
  api-server:
    image: ghcr.io/aryankinha2024/api-server:latest
    container_name: api-server
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - api-network
    security_opt:
      - no-new-privileges:true

networks:
  api-network:
    driver: bridge
